name: CampusConnect CI

on:
  push:
    branches:
      - main
      - refactor/final-folder-structure
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend TypeScript and Vite build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend syntax and FastAPI import check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Import FastAPI app and verify routes
        working-directory: backend
        run: |
          python -c "from main import app; paths = {route.path for route in app.routes}; required = {'/api/health', '/api/me', '/api/requests', '/api/requests/{request_id}'}; missing = required - paths; assert not missing, f'Missing API routes: {missing}'; print('FastAPI app imported and all expected routes registered.')"
